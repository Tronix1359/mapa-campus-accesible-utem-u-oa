 DE EGRESO: 5 tarjetas</text><rect x="40" y="767" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="40" y="803" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="20" y="855" width="320" height="150" fill="#eef" stroke="#334" stroke-width="1.5"/><text x="32" y="875" font-size="12" font-family="monospace" fill="#112">RESPALDO: acreditación, certificación,</text><text x="32" y="891" font-size="12" font-family="monospace" fill="#112">plan oficial</text><rect x="40" y="925" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="40" y="961" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="20" y="1013" width="320" height="195" fill="#fff" stroke="#334" stroke-width="1.5"/><text x="32" y="1033" font-size="12" font-family="monospace" fill="#112">ADMISIÓN: vías, ponderaciones, costos,</text><text x="32" y="1049" font-size="12" font-family="monospace" fill="#112">fechas</text><rect x="40" y="1128" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="40" y="1164" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="20" y="1216" width="320" height="225" fill="#eef" stroke="#334" stroke-width="1.5"/><text x="32" y="1236" font-size="12" font-family="monospace" fill="#112">PLAN DE ESTUDIOS: filtro + 8 semestres</text><rect x="40" y="1361" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="40" y="1397" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="20" y="1449" width="320" height="135" fill="#fff" stroke="#334" stroke-width="1.5"/><text x="32" y="1469" font-size="12" font-family="monospace" fill="#112">PREGUNTAS FRECUENTES: acordeón</text><rect x="40" y="1504" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rect x="40" y="1540" width="280" height="28" fill="none" stroke="#778" stroke-dasharray="4 3"/><rec