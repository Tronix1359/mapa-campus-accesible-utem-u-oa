<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Campus Accesible — Mapa Interactivo UTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

:root{
  --blue:#1B4FD8; --blue-dark:#1338B0; --blue-light:#EEF3FF;
  --green:#059669; --green-light:#D1FAE5;
  --red:#DC2626; --red-light:#FEE2E2;
  --amber:#D97706; --amber-light:#FEF3C7;
  --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0;
  --gray-300:#CBD5E1; --gray-400:#94A3B8; --gray-500:#64748B;
  --gray-600:#475569; --gray-700:#334155; --gray-800:#1E293B; --gray-900:#0F172A;
  --white:#ffffff;
  --font-head:'Sora',sans-serif;
  --font-body:'Outfit',sans-serif;
  --radius:10px; --radius-sm:7px; --radius-lg:16px;
  --shadow:0 2px 16px rgba(27,79,216,0.07);
  --shadow-lg:0 8px 32px rgba(27,79,216,0.12);
}

body{
  font-family:var(--font-body); font-size:15px; color:var(--gray-800);
  background:#0F172A; height:100vh; display:flex; flex-direction:column;
}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#0F172A 0%,#1B2B4B 100%);
  border-bottom:1px solid rgba(255,255,255,0.08);
  padding:0 24px; height:58px; display:flex; align-items:center;
  gap:16px; flex-shrink:0; position:relative; z-index:50;
}
.logo{
  font-family:var(--font-head); font-size:17px; font-weight:800;
  color:#fff; display:flex; align-items:center; gap:10px; letter-spacing:-0.3px;
}
.logo-icon{
  width:34px; height:34px; background:linear-gradient(135deg,var(--blue),#3B82F6);
  border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:17px; box-shadow:0 4px 12px rgba(27,79,216,0.4);
}
.logo-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,0.45);font-family:var(--font-body);letter-spacing:0.05em;text-transform:uppercase;margin-top:1px}
.header-center{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.module-pill{
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:5px 14px; font-size:12px; font-weight:600;
  color:rgba(255,255,255,0.7); cursor:pointer; transition:all 0.18s ease;
  font-family:var(--font-head);
}
.module-pill:hover{background:rgba(255,255,255,0.15);color:#fff}
.module-pill.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(27,79,216,0.45)}
.header-right{display:flex;align-items:center;gap:8px}
.accessibility-btn{
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  border-radius:8px; padding:6px 12px; font-size:12px; color:rgba(255,255,255,0.65);
  cursor:pointer; transition:all 0.18s; font-family:var(--font-body); font-weight:500;
  display:flex; align-items:center; gap:5px;
}
.accessibility-btn:hover{background:rgba(255,255,255,0.13);color:#fff}
.accessibility-btn.on{background:rgba(5,150,105,0.25);border-color:#059669;color:#34D399}

/* ── LAYOUT ── */
.app{display:flex;flex:1;overflow:hidden;height:calc(100vh - 58px)}

/* ── SIDEBAR ── */
.sidebar{
  width:320px; flex-shrink:0;
  background:#1E293B;
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-search{
  padding:16px; border-bottom:1px solid rgba(255,255,255,0.06);
}
.search-box{
  width:100%; background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.1);
  border-radius:var(--radius); padding:10px 14px; font-size:13.5px;
  color:#fff; font-family:var(--font-body); outline:none; transition:all 0.18s;
}
.search-box::placeholder{color:rgba(255,255,255,0.35)}
.search-box:focus{border-color:var(--blue);background:rgba(27,79,216,0.12)}
.filter-chips{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.chip{
  padding:4px 11px; border-radius:20px; font-size:11.5px; font-weight:600;
  border:1.5px solid rgba(255,255,255,0.1); background:transparent;
  color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.15s;
}
.chip:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}

.sidebar-list{flex:1;overflow-y:auto;padding:8px}
.sidebar-list::-webkit-scrollbar{width:4px}
.sidebar-list::-webkit-scrollbar-track{background:transparent}
.sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}

/* Group headers */
.group-header{
  padding:10px 10px 5px;
  font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);
  text-transform:uppercase;letter-spacing:0.1em;font-family:var(--font-head);
}
/* Result item */
.result-item{
  padding:11px 12px; border-radius:var(--radius-sm); cursor:pointer;
  border:1.5px solid transparent; margin-bottom:2px; transition:all 0.15s;
  display:flex; align-items:flex-start; gap:10px;
}
.result-item:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.08)}
.result-item.selected{background:rgba(27,79,216,0.2);border-color:var(--blue)}
.result-icon{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:rgba(255,255,255,0.08);margin-top:1px;
}
.result-icon.blue-bg{background:rgba(27,79,216,0.25)}
.result-icon.green-bg{background:rgba(5,150,105,0.25)}
.result-body{flex:1;min-width:0}
.result-name{font-size:13.5px;font-weight:600;color:#fff;line-height:1.3}
.result-sub{font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:2px;line-height:1.4}
.result-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;
  display:inline-flex;align-items:center;gap:3px;
}
.tag-green{background:rgba(5,150,105,0.2);color:#34D399}
.tag-blue{background:rgba(27,79,216,0.2);color:#93C5FD}
.tag-amber{background:rgba(217,119,6,0.2);color:#FCD34D}
.tag-red{background:rgba(220,38,38,0.2);color:#FCA5A5}

/* ── MAP AREA ── */
.map-area{
  flex:1; display:flex; flex-direction:column; overflow:hidden; background:#0F172A;
}

/* Floor tabs bar */
.floor-bar{
  background:#1E293B; border-bottom:1px solid rgba(255,255,255,0.06);
  padding:10px 16px; display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.floor-bar-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.08em;margin-right:4px}
.floor-btn{
  padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600;
  border:1.5px solid rgba(255,255,255,0.1); background:transparent;
  color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.18s;
  font-family:var(--font-head);
}
.floor-btn:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
.floor-btn.active{background:var(--green);border-color:var(--green);color:#fff}
.floor-bar-right{margin-left:auto;display:flex;gap:6px}
.zoom-btn{
  width:32px;height:32px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);
  font-size:16px;cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;font-weight:700;
}
.zoom-btn:hover{background:rgba(255,255,255,0.12);color:#fff}

/* Map viewport */
.map-viewport{
  flex:1; overflow:hidden; position:relative; cursor:grab;
  display:flex;align-items:center;justify-content:center;
}
.map-viewport:active{cursor:grabbing}
.map-inner{
  position:absolute; top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  transform-origin:center center;
}
#map-svg-el{
  max-width:95%; max-height:95%;
  border-radius:12px;
  filter:drop-shadow(0 8px 40px rgba(0,0,0,0.6));
  transition:transform 0.15s ease;
}

/* SVG color overrides - make maps look sharp on dark bg */
#map-svg-el rect[fill="white"],#map-svg-el rect[fill="#ffffff"]{fill:#FAFBFF}
#map-svg-el [fill="#D9D9D9"],[fill="#d9d9d9"]{fill:#C8D6EE}
#map-svg-el [fill="#CFCFCF"]{fill:#B8CCE4}
#map-svg-el [fill="#F5F0E8"],[fill="#f5f0e8"]{fill:#F5F1EB}
#map-svg-el [fill="#EF9A9A"]{fill:#FCA5A5}
#map-svg-el [fill="#A5D6A7"]{fill:#6EE7B7}
#map-svg-el [fill="#388E3C"]{fill:#059669}
#map-svg-el [fill="#BDD7EE"]{fill:#93C5FD}
#map-svg-el [fill="#FFCC80"]{fill:#FCD34D}
#map-svg-el [fill="#FFE0B2"]{fill:#FDE68A}
#map-svg-el [fill="#C8E6C9"]{fill:#A7F3D0}
#map-svg-el [fill="#E1BEE7"]{fill:#DDD6FE}
#map-svg-el [fill="#F9A825"]{fill:#FBBF24}
#map-svg-el [fill="#90CAF9"],[fill="#B0C4DE"]{fill:#BAE6FD}
#map-svg-el text{font-family:'Outfit',sans-serif!important}

/* Overlay badges */
.map-badge{
  position:absolute; padding:8px 14px; border-radius:10px;
  font-size:12px; font-weight:700; font-family:var(--font-head);
  display:flex;align-items:center;gap:7px; backdrop-filter:blur(8px);
  pointer-events:none;
}
.map-badge-top{
  top:16px;left:16px;
  background:rgba(27,79,216,0.85);color:#fff;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 4px 20px rgba(27,79,216,0.4);
}
.map-badge-acc{
  top:16px;right:16px;
  background:rgba(5,150,105,0.85);color:#fff;
  border:1px solid rgba(255,255,255,0.2);
}
.map-legend{
  position:absolute;bottom:16px;right:16px;
  background:rgba(15,23,42,0.9);border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);
  font-size:11px;color:rgba(255,255,255,0.7);font-family:var(--font-body);
  min-width:120px;
}
.legend-title{font-size:10px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.legend-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* ── ROUTE PANEL ── */
.route-panel{
  position:absolute;bottom:16px;left:16px;
  background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;padding:16px;backdrop-filter:blur(12px);
  max-width:300px;display:none;animation:slideUp 0.25s ease;
  max-height:calc(100vh - 200px);overflow-y:auto;
}
.route-panel.show{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.route-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.route-title{font-size:14px;font-weight:700;color:#fff;font-family:var(--font-head)}
.route-close{background:rgba(255,255,255,0.1);border:none;border-radius:6px;width:26px;height:26px;color:rgba(255,255,255,0.6);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.route-close:hover{background:rgba(255,255,255,0.2);color:#fff}
.route-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.route-stat{background:rgba(255,255,255,0.05);border-radius:8px;padding:8px;text-align:center}
.route-stat-val{font-size:15px;font-weight:700;color:#fff;font-family:var(--font-head)}
.route-stat-lbl{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.05em;margin-top:1px}
.route-steps{list-style:none}
.route-step{
  display:flex;align-items:flex-start;gap:9px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);font-size:12.5px;color:rgba(255,255,255,0.75);
  line-height:1.5;
}
.route-step:last-child{border:none}
.step-num{
  width:22px;height:22px;border-radius:50%;background:var(--blue);
  color:#fff;font-size:10px;font-weight:700;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.route-speak-btn{
  width:100%;margin-top:10px;padding:9px;border-radius:8px;
  background:var(--blue);color:#fff;border:none;cursor:pointer;
  font-size:12.5px;font-weight:600;font-family:var(--font-body);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background 0.15s;
}
.route-speak-btn:hover{background:var(--blue-dark)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#1E293B;border:1px solid rgba(255,255,255,0.1);
  color:#fff;padding:11px 20px;border-radius:10px;
  font-size:13px;font-weight:500;opacity:0;transition:all 0.3s ease;
  z-index:1000;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);background:rgba(5,150,105,0.2)}

/* High contrast */
body.hc{filter:contrast(1.5);background:#000}
body.font-lg{font-size:18px!important}
body.font-xl{font-size:21px!important}

@media(max-width:768px){
  .sidebar{width:100%;height:220px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.06)}
  .app{flex-direction:column}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">♿</div>
    <div>
      Campus Accesible
      <div class="logo-sub">UTEM · Navegación Inclusiva</div>
    </div>
  </div>

  <div class="header-center" id="module-pills">
    <button class="module-pill active" data-map="general" onclick="setMap(this,'general')">🗺 Campus General</button>
    <button class="module-pill" data-map="externo" onclick="setMap(this,'externo')">🏛 Exterior</button>
    <button class="module-pill" data-map="m1" onclick="setMap(this,'m1')">M1</button>
    <button class="module-pill" data-map="m3" onclick="setMap(this,'m3')">M3</button>
  </div>

  <div class="header-right">
    <button class="accessibility-btn" onclick="cycleFont()" title="Tamaño texto">Aa</button>
    <button class="accessibility-btn" id="btn-hc" onclick="toggleHC()" title="Alto contraste">◑</button>
    <button class="accessibility-btn" id="btn-audio" onclick="toggleAudio()" title="Audio">🔊</button>
  </div>
</header>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-search">
      <input type="search" class="search-box" id="search-input"
             placeholder="🔍 Buscar sala o módulo..." oninput="filterResults(this.value)"
             autocomplete="off" aria-label="Buscar sala"/>
      <div class="filter-chips">
        <button class="chip active" data-filter="all" onclick="setFilter(this,'all')">Todos</button>
        <button class="chip" data-filter="accessible" onclick="setFilter(this,'accessible')">♿ Accesible</button>
        <button class="chip" data-filter="m1" onclick="setFilter(this,'m1')">M1</button>
        <button class="chip" data-filter="m3" onclick="setFilter(this,'m3')">M3</button>
        <button class="chip" data-filter="service" onclick="setFilter(this,'service')">Servicios</button>
      </div>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </aside>

  <!-- MAP -->
  <div class="map-area">
    <!-- Floor bar -->
    <div class="floor-bar" id="floor-bar" style="display:none">
      <span class="floor-bar-label">Piso</span>
      <button class="floor-btn active" data-floor="1" onclick="setFloor(this,1)">Piso 1</button>
      <button class="floor-btn" data-floor="2" onclick="setFloor(this,2)">Piso 2</button>
      <button class="floor-btn" data-floor="3" onclick="setFloor(this,3)">Piso 3</button>
      <button class="floor-btn" data-floor="4" onclick="setFloor(this,4)">Piso 4</button>
      <div class="floor-bar-right">
        <button class="zoom-btn" onclick="zoom(1.25)" aria-label="Acercar">+</button>
        <button class="zoom-btn" onclick="zoom(0.8)" aria-label="Alejar">−</button>
        <button class="zoom-btn" onclick="resetView()" aria-label="Resetear">⌂</button>
      </div>
    </div>
    <div class="floor-bar" id="main-controls" style="display:flex">
      <span class="floor-bar-label">Vista</span>
      <span id="view-label" style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.7)">Campus General</span>
      <div class="floor-bar-right">
        <button class="zoom-btn" onclick="zoom(1.25)" aria-label="Acercar">+</button>
        <button class="zoom-btn" onclick="zoom(0.8)" aria-label="Alejar">−</button>
        <button class="zoom-btn" onclick="resetView()" aria-label="Resetear">⌂</button>
      </div>
    </div>

    <div class="map-viewport" id="map-viewport">
      <div class="map-inner" id="map-inner">
        <svg id="map-svg-el" viewBox="0 0 663 419" xmlns="http://www.w3.org/2000/svg"
             role="img" aria-label="Plano del campus" tabindex="0"></svg>
      </div>

      <div class="map-badge map-badge-top" id="map-badge">
        🗺 Campus General — Vista aérea
      </div>
      <div class="map-badge map-badge-acc" id="acc-badge">
        ♿ Ruta accesible activa
      </div>

      <div class="map-legend">
        <div class="legend-title">Referencia</div>
        <div class="legend-row"><div class="leg-dot" style="background:#C8D6EE"></div>Sala / Edificio</div>
        <div class="legend-row"><div class="leg-dot" style="background:#6EE7B7"></div>Rampa / Acceso</div>
        <div class="legend-row"><div class="leg-dot" style="background:#FCA5A5"></div>Escaleras</div>
        <div class="legend-row"><div class="leg-dot" style="background:#FCD34D"></div>Ascensor</div>
        <div class="legend-row"><div class="leg-dot" style="background:#059669"></div>Entrada</div>
        <div class="legend-row"><div class="leg-dot" style="background:#FDE68A"></div>Área común</div>
      </div>

      <!-- Route panel -->
      <div class="route-panel" id="route-panel">
        <div class="route-panel-header">
          <span class="route-title" id="route-title">Ruta accesible</span>
          <button class="route-close" onclick="closeRoute()">✕</button>
        </div>
        <div class="route-stats" id="route-stats"></div>
        <ol class="route-steps" id="route-steps"></ol>
        <button class="route-speak-btn" id="btn-speak" onclick="speakRoute()">
          🔊 Escuchar instrucciones
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================================================================
//  CAMPUS ACCESIBLE — JS PRINCIPAL
//  Solo mapa interactivo con rutas accesibles completas
// ===================================================================

// ---- Campus Data: M1 + M3, salas por piso ----
// Sistema: M(edificio) piso_sala — ej: "M1 101" = M1 piso 1 sala 1
const MODULES = {
  M1: {
    label: 'Módulo 1',
    icon: '🏛',
    accessible: true,
    floors: 4,
    elevators: ['E1 — Disponible'],
    ramps: ['Rampa principal fachada norte', 'Rampa acceso sur'],
    toilets: ['Baño accesible P1', 'Baño accesible P3'],
    desc: 'Módulo 1 — 4 pisos, ascensor E1, acceso rampa norte.',
    map: 'm1',
    rooms: {
      1: [
        {id:'M1 101', label:'Sala 101', type:'aula', accessible:true, desc:'Sala de clases P1'},
        {id:'M1 102', label:'Sala 102', type:'aula', accessible:true, desc:'Sala de clases P1'},
        {id:'M1 103', label:'Sala 103', type:'aula', accessible:true, desc:'Sala de clases P1'},
        {id:'M1 104', label:'Sala 104', type:'aula', accessible:true, desc:'Sala de clases P1'},
        {id:'M1 105', label:'Sala 105', type:'lab', accessible:true, desc:'Laboratorio P1'},
        {id:'M1 106', label:'Baño P1', type:'toilet', accessible:true, desc:'Baño accesible planta 1'},
        {id:'M1 107', label:'Entrada M1', type:'entry', accessible:true, desc:'Acceso principal rampa'},
      ],
      2: [
        {id:'M1 201', label:'Sala 201', type:'aula', accessible:true, desc:'Sala de clases P2'},
        {id:'M1 202', label:'Sala 202', type:'aula', accessible:true, desc:'Sala de clases P2'},

// ---- Route generation ----
// Rooms keyed by id → route steps from Acceso 1
const ROUTE_DB = {};

function buildRoutes() {
  // M1 routes
  const m1base = ['Ingrese por Acceso 1 (rampa automática disponible)', 'Avance por el sendero pavimentado hacia M1 (~60m)', 'Use la rampa norte de M1 para acceder al edificio'];
  const m1elev = 'Tome el ascensor E1 en planta baja';
  const M1FLOORS = {
    1: {dist:'80m', time:'2 min', ramps:1, elev:0, extra:[]},
    2: {dist:'130m', time:'3 min', ramps:1, elev:1, extra:[m1elev,'Salga en Piso 2']},
    3: {dist:'150m', time:'4 min', ramps:1, elev:1, extra:[m1elev,'Salga en Piso 3']},
    4: {dist:'170m', time:'5 min', ramps:1, elev:1, extra:[m1elev,'Salga en Piso 4']},
  };
  for (const [floor, fdata] of Object.entries(M1FLOORS)) {
    for (const room of MODULES.M1.rooms[floor]) {
      const steps = [...m1base, ...fdata.extra, `Siga la señalética hacia ${room.label}`];
      if (!room.accessible) steps.push('⚠️ Atención: el acceso interno puede requerir asistencia');
      ROUTE_DB[room.id] = {
        dest: room.label, module: 'M1', floor: parseInt(floor),
        dist: fdata.dist, time: fdata.time, ramps: fdata.ramps, elev: fdata.elev,
        steps, accessible: room.accessible
      };
    }
  }
  // M3 routes
  const m3base = ['Ingrese por Acceso 1 (rampa automática)', 'Avance por pasillo central hacia M3 (~120m)', 'Use la rampa lateral oeste para acceder a M3'];
  const m3elev = 'Tome el ascensor E3b (E3 en mantención) en planta baja';
  const M3FLOORS = {
    1: {dist:'140m', time:'3 min', ramps:1, elev:0, extra:[]},
    2: {dist:'190m', time:'4 min', ramps:1, elev:1, extra:[m3elev,'Salga en Piso 2']},
    3: {dist:'210m', time:'5 min', ramps:1, elev:1, extra:[m3elev,'Salga en Piso 3']},
    4: {dist:'230m', time:'6 min', ramps:1, elev:1, extra:[m3elev,'Salga en Piso 4']},
  };
  for (const [floor, fdata] of Object.entries(M3FLOORS)) {
    for (const room of MODULES.M3.rooms[floor]) {
      const steps = [...m3base, ...fdata.extra, `Siga la señalética hacia ${room.label}`];
      if (!room.accessible) steps.push('⚠️ Atención: acceso interno puede requerir asistencia');
      ROUTE_DB[room.id] = {
        dest: room.label, module: 'M3', floor: parseInt(floor),
        dist: fdata.dist, time: fdata.time, ramps: fdata.ramps, elev: fdata.elev,
        steps, accessible: room.accessible
      };
    }
  }
  // General map items
  const generalRoutes = {
    'G-M1': {steps:['Ingrese por Acceso 1','Avance 60m norte hacia M1','Entrada con rampa automática'],dist:'80m',time:'2 min',ramps:1,elev:0},

    'G-CAF': {steps:['Ingrese por Acceso 1','Avance 40m al centro','Casino a su izquierda, planta baja sin escalones'],dist:'50m',time:'1 min',ramps:0,elev:0},
    'G-SESAES': {steps:['Ingrese por Acceso 1','Avance 20m','SESAES en primer edificio a la derecha'],dist:'30m',time:'1 min',ramps:0,elev:0},
    'G-ACC2': {steps:['Ingrese por Acceso 2 (sur)','Sendero pavimentado hacia campus central'],dist:'0m',time:'1 min',ramps:1,elev:0},
  };
  for (const [id, r] of Object.entries(generalRoutes)) {
    ROUTE_DB[id] = {dest: id, module:'Campus', floor:1, accessible:true, ...r};
  }
}

const MAP_META = {
  general: {viewBox:'0 0 663 419', label:'🗺 Campus General — Vista completa'},
  externo: {viewBox:'0 0 469 419', label:'🏛 Plano Exterior del Campus'},
  m1_p1:   {viewBox:'0 0 181 223', label:'📐 M1 — Piso 1'},
  m1_p2:   {viewBox:'0 0 181 223', label:'📐 M1 — Piso 2'},
  m1_p3:   {viewBox:'0 0 181 223', label:'📐 M1 — Piso 3'},
  m1_p4:   {viewBox:'0 0 181 223', label:'📐 M1 — Piso 4'},
  m3_p1:   {viewBox:'0 0 181 223', label:'📐 M3 — Piso 1'},
  m3_p2:   {viewBox:'0 0 181 223', label:'📐 M3 — Piso 2'},
  m3_p3:   {viewBox:'0 0 181 223', label:'📐 M3 — Piso 3'},
  m3_p4:   {viewBox:'0 0 181 223', label:'📐 M3 — Piso 4'},
};

function loadMap(key) {
  const meta = MAP_META[key];
  if (!meta) return;
  const svg = document.getElementById('map-svg-el');
  svg.setAttribute('viewBox', meta.viewBox);
  svg.innerHTML = SVG_CONTENT[key] || '';
  document.getElementById('map-badge').textContent = meta.label;
  document.getElementById('view-label').textContent = meta.label.replace(/^[^ ]+ /,'');
  state.scale = 1; state.tx = 0; state.ty = 0;
  updateTransform();
}

// ---- Module / Floor switching ----
function setMap(btn, key) {
  document.querySelectorAll('.module-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const floorBar = document.getElementById('floor-bar');
  const mainCtrl = document.getElementById('main-controls');
  if (key === 'm1' || key === 'm3') {
    state.module = key;
    state.floor = 1;
    floorBar.style.display = 'flex';
    mainCtrl.style.display = 'none';
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', b.dataset.floor === '1'));
    loadMap(key + '_p1');
  } else {
    state.module = null;
    floorBar.style.display = 'none';
    mainCtrl.style.display = 'flex';
    loadMap(key);
  }
  renderList();
}

function setFloor(btn, floor) {
  state.floor = floor;
  document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.floor) === floor));
  loadMap(state.module + '_p' + floor);
  renderList();
  closeRoute();
}

// ---- Sidebar rendering ----
function getRooms() {
  const rooms = [];
  if (state.module === 'm1') {
    const floorRooms = MODULES.M1.rooms[state.floor] || [];
    floorRooms.forEach(r => rooms.push({...r, module:'M1'}));
  } else if (state.module === 'm3') {
    const floorRooms = MODULES.M3.rooms[state.floor] || [];
    floorRooms.forEach(r => rooms.push({...r, module:'M3'}));
  } else {
    // General view — show all modules + notable rooms
    const gRooms = MODULES.GENERAL.rooms[1] || [];
    gRooms.forEach(r => rooms.push({...r, module:'Campus'}));
  }
  return rooms;
}

const ROOM_ICONS = {aula:'🚪', lab:'🔬', toilet:'🚻', entry:'🚪', admin:'📋', library:'📚', meeting:'👥', common:'☕', service:'🍽', module:'🏛'};
const ROOM_COLORS = {aula:'blue-bg', lab:'blue-bg', toilet:'green-bg', entry:'green-bg', admin:'blue-bg', library:'blue-bg', meeting:'blue-bg', common:'green-bg', service:'green-bg', module:'blue-bg'};

function renderList() {
  const container = document.getElementById('sidebar-list');
  let rooms = getRooms();
  const q = state.query.toLowerCase();
  const f = state.filter;
  rooms = rooms.filter(r => {
    if (q && !r.label.toLowerCase().includes(q) && !r.id.toLowerCase().includes(q) && !r.desc.toLowerCase().includes(q)) return false;
    if (f === 'accessible' && !r.accessible) return false;
    if (f === 'm1' && !r.id.startsWith('M1')) return false;
    if (f === 'm3' && !r.id.startsWith('M3')) return false;
    if (f === 'service' && !['service','toilet','library'].includes(r.type)) return false;
    return true;
  });

  if (!rooms.length) {
    container.innerHTML = '<div style="padding:24px 16px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px">Sin resultados</div>';
    return;
  }

  // Group by floor if showing module
  let html = '';
  if (state.module) {
    html += `<div class="group-header">Piso ${state.floor} — ${rooms.length} espacios</div>`;
    rooms.forEach(r => { html += roomCard(r); });
  } else {
    html += `<div class="group-header">Campus — ${rooms.length} espacios</div>`;
    rooms.forEach(r => { html += roomCard(r); });
  }
  container.innerHTML = html;
}

function roomCard(r) {
  const icon = ROOM_ICONS[r.type] || '📍';
  const color = ROOM_COLORS[r.type] || 'blue-bg';
  const accTag = r.accessible
    ? '<span class="tag tag-green">♿ Accesible</span>'
    : '<span class="tag tag-red">⚠️ Limitado</span>';
  const modTag = r.module ? `<span class="tag tag-blue">${r.module}</span>` : '';
  const hasRoute = ROUTE_DB[r.id] ? '<span class="tag tag-amber">🗺 Ruta</span>' : '';
  return `<div class="result-item" onclick="selectRoom('${r.id}')" tabindex="0" role="button"
              onkeypress="if(event.key==='Enter')selectRoom('${r.id}')"
              aria-label="${r.label} — ${r.desc}">
    <div class="result-icon ${color}">${icon}</div>
    <div class="result-body">
      <div class="result-name">${r.label}</div>
      <div class="result-sub">${r.id} · ${r.desc}</div>
      <div class="result-badges">${accTag}${modTag}${hasRoute}</div>
    </div>
  </div>`;
}

function filterResults(q) {
  state.query = q;
  renderList();
}

function setFilter(btn, f) {
  state.filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ---- Room selection & route ----
function selectRoom(id) {
  // Highlight in sidebar
  document.querySelectorAll('.result-item').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`[onclick="selectRoom('${id}')"]`);
  if (el) el.classList.add('selected');

  // Show route if exists
  const route = ROUTE_DB[id];
  if (!route) { toast('Sin ruta registrada para este espacio'); return; }
  showRoute(route);

  // Switch map to appropriate module/floor
  if (route.module === 'M1') {
    document.querySelectorAll('.module-pill').forEach(b => b.classList.remove('active'));
    const mpill = document.querySelector('[data-map="m1"]');
    if (mpill) mpill.classList.add('active');
    state.module = 'm1'; state.floor = route.floor;
    document.getElementById('floor-bar').style.display = 'flex';
    document.getElementById('main-controls').style.display = 'none';
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.floor) === route.floor));
    loadMap('m1_p' + route.floor);
  } else if (route.module === 'M3') {
    document.querySelectorAll('.module-pill').forEach(b => b.classList.remove('active'));
    const mpill = document.querySelector('[data-map="m3"]');
    if (mpill) mpill.classList.add('active');
    state.module = 'm3'; state.floor = route.floor;
    document.getElementById('floor-bar').style.display = 'flex';
    document.getElementById('main-controls').style.display = 'none';
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.floor) === route.floor));
    loadMap('m3_p' + route.floor);
  }
  if (state.audioEnabled) speakText(`Ruta a ${route.dest}. ${route.steps[0]}`);
}

function showRoute(route) {
  state.currentRoute = route;
  const panel = document.getElementById('route-panel');
  document.getElementById('route-title').textContent = `Ruta → ${route.dest}`;
  document.getElementById('route-stats').innerHTML = `
    <div class="route-stat"><div class="route-stat-val">${route.dist}</div><div class="route-stat-lbl">Distancia</div></div>
    <div class="route-stat"><div class="route-stat-val">${route.time}</div><div class="route-stat-lbl">Tiempo</div></div>
    <div class="route-stat"><div class="route-stat-val">${route.ramps + route.elev}</div><div class="route-stat-lbl">Rampas+Asc.</div></div>
  `;
  document.getElementById('route-steps').innerHTML = route.steps.map((s,i) =>
    `<li class="route-step"><span class="step-num">${i+1}</span>${s}</li>`
  ).join('');
  document.getElementById('acc-badge').style.display = route.accessible ? 'flex' : 'none';
  panel.classList.add('show');
}

function closeRoute() {
  document.getElementById('route-panel').classList.remove('show');
  document.getElementById('acc-badge').style.display = 'none';
  state.currentRoute = null;
}

function speakRoute() {
  if (!state.currentRoute) return;
  const text = state.currentRoute.steps.join('. ');
  speakText(text);
}

// ---- Audio ----
function speakText(text) {
  if (!state.speechSynth) return toast('Audio no disponible en este navegador');
  state.speechSynth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'es-CL'; utt.rate = 0.9; utt.pitch = 1;
  const btn = document.getElementById('btn-speak');
  utt.onstart = () => { state.speaking = true; if(btn) btn.textContent = '⏹ Detener audio'; };
  utt.onend = utt.onerror = () => { state.speaking = false; if(btn) btn.textContent = '🔊 Escuchar instrucciones'; };
  state.speechSynth.speak(utt);
}

function toggleAudio() {
  state.audioEnabled = !state.audioEnabled;
  const btn = document.getElementById('btn-audio');
  btn.classList.toggle('on', state.audioEnabled);
  toast(state.audioEnabled ? '🔊 Audio activado' : '🔇 Audio desactivado');
}

// ---- Zoom & Pan ----
function updateTransform() {
  const inner = document.getElementById('map-inner');
  inner.style.transform = `translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;
}
function zoom(factor) {
  state.scale = Math.min(5, Math.max(0.4, state.scale * factor));
  updateTransform();
}
function resetView() {
  state.scale = 1; state.tx = 0; state.ty = 0; updateTransform();
}

document.addEventListener('DOMContentLoaded', () => {
  const vp = document.getElementById('map-viewport');

  // Mouse drag
  vp.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY;
  });
  document.addEventListener('mousemove', e => {
    if (!state.dragging) return;
    state.tx += (e.clientX - state.lastX);
    state.ty += (e.clientY - state.lastY);
    state.lastX = e.clientX; state.lastY = e.clientY;
    updateTransform();
  });
  document.addEventListener('mouseup', () => { state.dragging = false; });

  // Wheel zoom
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.1 : 0.9);
  }, {passive: false});

  // Touch pan/pinch
  let touches = [], lastDist = 0;
  vp.addEventListener('touchstart', e => {
    touches = [...e.touches];
    if (e.touches.length === 1) { state.dragging = true; state.lastX = e.touches[0].clientX; state.lastY = e.touches[0].clientY; }
    if (e.touches.length === 2) { lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
  }, {passive:true});
  vp.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && state.dragging) {
      state.tx += e.touches[0].clientX - state.lastX;
      state.ty += e.touches[0].clientY - state.lastY;
      state.lastX = e.touches[0].clientX; state.lastY = e.touches[0].clientY;
      updateTransform();
    }
    if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      zoom(dist/lastDist); lastDist = dist;
    }
  }, {passive:true});
  vp.addEventListener('touchend', () => { state.dragging = false; });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') zoom(1.15);
    if (e.key === '-') zoom(0.87);
    if (e.key === '0') resetView();
    if (e.key === 'Escape') closeRoute();
  });

  // Load initial map
  loadMap('general');
  renderList();
});

// ---- Accessibility controls ----
function toggleHC() {
  state.hc = !state.hc;
  document.body.classList.toggle('hc', state.hc);
  document.getElementById('btn-hc').classList.toggle('on', state.hc);
  toast(state.hc ? 'Alto contraste activado' : 'Alto contraste desactivado');
}
const fontClasses = ['','font-lg','font-xl'];
let fontLvl = 0;
function cycleFont() {
  document.body.classList.remove(...fontClasses.filter(Boolean));
  fontLvl = (fontLvl + 1) % 3;
  if (fontClasses[fontLvl]) document.body.classList.add(fontClasses[fontLvl]);
  toast(['Texto normal','Texto grande','Texto muy grande'][fontLvl]);
}

// ---- Toast ----
let toastTimer;
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
